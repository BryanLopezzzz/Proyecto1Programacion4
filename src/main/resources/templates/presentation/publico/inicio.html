<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Bolsa de Empleo</title>
    <link rel="stylesheet" href="/css/estilos.css" th:href="@{/css/estilos.css}"/>
</head>
<body>

<nav>
    <div>
        <span class="brand">BolsaEmpleo</span>
        <a th:href="@{/buscar}">Buscar puestos</a>
        <a th:href="@{/registro/empresa}">Registro Empresa</a>
        <a th:href="@{/registro/oferente}">Registro Oferente</a>
    </div>
    <div>
        <a th:href="@{/login}"  sec:authorize="isAnonymous()">Login</a>
        <a th:href="@{/logout}" sec:authorize="isAuthenticated()">Salir</a>
    </div>
</nav>

<div class="container">
    <h1>Bolsa de Empleo</h1>
    <p class="subtitulo-seccion">Últimos 5 puestos públicos</p>

    <div class="puesto-grid">
        <div class="puesto-card" th:each="p : ${puestos}">

            <div class="puesto-card-empresa" th:text="${p.empresa.nombre}"></div>
            <div class="puesto-card-desc"
                 th:text="${#strings.abbreviate(p.descripcion, 50)}"></div>
            <span class="puesto-card-salario"
                  th:text="${p.moneda.codigo + ' ' + #numbers.formatDecimal(p.salario, 1, 'COMMA', 2, 'POINT')}">
            </span>

            <a class="btn btn-outline puesto-card-btn" th:href="@{/buscar}">Ver detalle</a>

            <div class="puesto-card-tooltip">
                <strong th:text="${p.descripcion}"></strong>
                <ul class="puesto-card-tooltip-list">
                    <li th:each="c : ${p.caracteristicas}"
                        th:text="${c.caracteristica.nombre + ' (nivel ' + c.nivelRequerido + ')'}">
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <p class="empty" th:if="${#lists.isEmpty(puestos)}">No hay puestos publicados aún.</p>
</div>

<footer>
    <strong>Bolsa de Empleo</strong>
    <span>Contacto: info@bolsaempleo.local | Créditos: Equipo de desarrollo</span>
</footer>

</body>
</html>
